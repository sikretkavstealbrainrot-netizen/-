<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSINT Scanner</title>
<style>
:root{--bg:#0b0f14;--p:#111823;--p2:#16202c;--ln:#22303f;--tx:#dbe6f2;--dim:#7d8fa3;--acc:#3ba3ff;--ok:#39d98a;--err:#ff5c5c;--gold:#ffc247}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{padding:12px 14px;border-bottom:1px solid var(--ln);background:#0e141c}
h1{margin:0 0 6px;font-size:16px}
.small{font-size:12px;color:var(--dim)}
#engine{font-size:12px;font-weight:700;color:var(--dim)}
#engine.good{color:var(--ok)}
#echo{font-size:11px;color:var(--dim)}
#myip{font-size:11px;color:var(--gold)}
#err{display:none;margin:8px 14px;padding:8px 10px;background:#2a1111;border:1px solid #5c2222;color:#ffb4b4;border-radius:8px;font-size:12px;white-space:pre-wrap}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px}
nav button{background:var(--p);border:1px solid var(--ln);color:var(--dim);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
nav button.on{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:700}
nav button.hot{border-color:var(--gold);color:var(--gold)}
nav button.hot.on{background:var(--gold);color:#1a1300}
main{padding:0 14px 50px}
.tab{display:none}.tab.on{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
input{flex:1;min-width:180px;background:var(--p);border:1px solid var(--ln);color:var(--tx);padding:11px 12px;border-radius:9px;font-size:14px}
input:focus{outline:none;border-color:var(--acc)}
.go{background:var(--acc);color:#04121f;border:0;padding:11px 18px;border-radius:9px;font-weight:700;cursor:pointer}
.gold{background:var(--gold);color:#1a1300;border:0;padding:11px 18px;border-radius:9px;font-weight:800;cursor:pointer}
.ghost{background:var(--p);color:var(--tx);border:1px solid var(--ln);padding:11px 16px;border-radius:9px;cursor:pointer}
.prog{font-size:12px;color:var(--dim);margin:6px 0}
.card{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin:8px 0}
.card .ct{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--acc);font-weight:700}
.card .cb{margin-top:6px;white-space:pre-wrap;word-break:break-word;font-size:13px}
.k{color:var(--dim)}a{color:var(--acc)}
.bad{color:var(--err)}.good{color:var(--ok)}.warn{color:var(--gold)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts a,.acts button{font-size:12px;padding:7px 11px;border-radius:8px;border:1px solid var(--ln);background:var(--p2);color:var(--tx);cursor:pointer;text-decoration:none}
.call{background:var(--ok)!important;color:#04121f!important;font-weight:800;border:0!important;font-size:15px!important;padding:10px 20px!important}
.chip{display:inline-block;background:var(--p2);border:1px solid var(--ln);border-radius:20px;padding:3px 10px;margin:3px 4px 0 0;font-size:12px}
.av{width:72px;height:72px;border-radius:50%;float:right;margin:0 0 6px 10px;object-fit:cover;border:1px solid var(--ln)}
</style>
</head>
<body>
<header>
  <h1>OSINT Scanner</h1>
  <div id="engine">движок: запускается...</div>
  <div id="echo">клики: 0</div>
  <div id="myip"></div>
</header>
<div id="err"></div>
<nav id="nav">
  <button data-tab="rep" class="on hot">ОТЧЁТ</button>
  <button data-tab="tg">Telegram</button>
  <button data-tab="nick">Ник</button>
  <button data-tab="mail">Email</button>
  <button data-tab="phone">Телефон</button>
  <button data-tab="dom">Домен</button>
  <button data-tab="net">Связь</button>
</nav>
<main>
  <section class="tab on" id="tab-rep">
    <div class="row"><input id="in-rep" data-enter="rep" placeholder="tg / ник / email / телефон / домен — что угодно"><button class="gold" data-act="rep">ПОЛНЫЙ ОТЧЁТ</button><button class="ghost" data-act="demo">Демо</button></div>
    <div id="prog-rep" class="prog"></div><div id="out-rep"></div>
  </section>
  <section class="tab" id="tab-tg">
    <div class="row"><input id="in-tg" data-enter="tg" placeholder="@username или https://t.me/username"><button class="go" data-act="tg">Анализ</button><button class="ghost" data-act="demo">Демо</button></div>
    <div id="prog-tg" class="prog"></div><div id="out-tg"></div>
  </section>
  <section class="tab" id="tab-nick">
    <div class="row"><input id="in-nick" data-enter="nick" placeholder="ник (torvalds)"><button class="go" data-act="nick">Искать</button><button class="ghost" data-act="demo">Демо</button></div>
    <div id="prog-nick" class="prog"></div><div id="out-nick"></div>
  </section>
  <section class="tab" id="tab-mail">
    <div class="row"><input id="in-mail" data-enter="mail" placeholder="email@domain.com"><button class="go" data-act="mail">Проверить</button><button class="ghost" data-act="demo">Демо</button></div>
    <div id="prog-mail" class="prog"></div><div id="out-mail"></div>
  </section>
  <section class="tab" id="tab-phone">
    <div class="row"><input id="in-phone" data-enter="phone" placeholder="+7 999 123-45-67"><button class="go" data-act="phone">Определить</button><button class="ghost" data-act="demo">Демо</button></div>
    <div id="prog-phone" class="prog"></div><div id="out-phone"></div>
  </section>
  <section class="tab" id="tab-dom">
    <div class="row"><input id="in-dom" data-enter="dom" placeholder="domain.com"><button class="go" data-act="dom">Сканировать</button><button class="ghost" data-act="demo">Демо</button></div>
    <div id="prog-dom" class="prog"></div><div id="out-dom"></div>
  </section>
  <section class="tab" id="tab-net">
    <div class="row"><button class="go" data-act="net">Проверить релеи и API</button></div>
    <div id="prog-net" class="prog"></div><div id="out-net"></div>
  </section>
</main>

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
var echoN=0;
function echo(t){echoN++;var e=$("#echo");if(e)e.textContent="клики: "+echoN+" · "+t;}
function status(t,c){var e=$("#engine");if(!e)return;e.textContent="движок: "+t;e.className=c||"";}
function showErr(m){var e=$("#err");if(!e)return;e.style.display="block";e.textContent="ОШИБКА JS: "+m;}
window.onerror=function(m,s,l){showErr(m+(l?" (строка "+l+")":""));return false;};

/* ---------- network ---------- */
function fetchT(url,ms,headers){
  ms=ms||9000;var c=new AbortController();var t=setTimeout(function(){c.abort();},ms);
  return fetch(url,{signal:c.signal,headers:headers||{}}).then(function(r){
    clearTimeout(t);if(!r.ok)throw new Error("HTTP "+r.status);return r.text();
  },function(e){clearTimeout(t);throw e;});
}
function directJson(url,ms,h){return fetchT(url,ms,h).then(function(t){return JSON.parse(t);});}
function getJson(url,ms,h){return directJson(url,ms,h).catch(function(){return api(url,ms).then(function(t){return JSON.parse(t);});});}
var RELAYS=[
  function(u){return "https://api.allorigins.win/raw?url="+encodeURIComponent(u);},
  function(u){return "https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u);},
  function(u){return "https://corsproxy.io/?"+encodeURIComponent(u);},
  function(u){return "https://r.jina.ai/"+u;},
  function(u){return "https://api.allorigins.win/get?url="+encodeURIComponent(u);}
];
var rstate=RELAYS.map(function(){return {f:0,dead:false};});
function relayFetch(i,url,ms){
  var isGet=(i===4);
  return fetchT(RELAYS[i](url),ms).then(function(t){
    if(isGet){try{var j=JSON.parse(t);if(j&&j.contents)return j.contents;}catch(e){}}
    return t;
  });
}
function api(url,ms){
  ms=ms||9000;
  return new Promise(function(resolve,reject){
    var alive=[];for(var i=0;i<RELAYS.length;i++)if(!rstate[i].dead)alive.push(i);
    if(!alive.length){for(var k=0;k<rstate.length;k++)rstate[k].dead=false;alive=RELAYS.map(function(_,j){return j;});}
    var done=false,errs=0,timers=[];
    alive.forEach(function(idx,order){
      var to=setTimeout(function(){
        relayFetch(idx,url,ms).then(function(txt){
          if(done)return;done=true;rstate[idx].f=0;timers.forEach(clearTimeout);resolve(txt);
        },function(){
          errs++;rstate[idx].f++;if(rstate[idx].f>=3)rstate[idx].dead=true;
          if(errs>=alive.length&&!done){done=true;reject(new Error("все релеи недоступны"));}
        });
      },order*2200);
      timers.push(to);
    });
  });
}

  function hx(n){var s="",j;for(j=0;j<4;j++)s+=("0"+((n>>(j*8))&0xFF).toString(16)).slice(-2);return s;}
  return hx(a)+hx(b)+hx(c)+hx(d);

/* ---------- helpers ---------- */
function uniq(a){var s={},o=[];a.forEach(function(x){if(!s[x]){s[x]=1;o.push(x);}});return o;}
function card(t,b){var d=document.createElement("div");d.className="card";d.innerHTML='<div class="ct">'+esc(t)+'</div><div class="cb">'+b+'</div>';return d;}

function normPhone(v){
  var d=String(v).replace(/[^\d+]/g,"").replace(/^\+/,"").replace(/\D/g,"");
  if(d.length===11&&d.charAt(0)==="8")d="7"+d.slice(1);
  if(d.length===10)d="7"+d;
  if(d.length===11&&d.charAt(0)==="7")return {e164:"+7"+d.slice(1),cc:"7",nat:d.slice(1)};
  var cc=null;for(var L=3;L>=1;L--){var p=d.slice(0,L);if(CC[p]){cc=p;break;}}
  return {e164:"+"+d,cc:cc,nat:cc?d.slice(cc.length):d};
}
function fmtNat(n){if(n.length===10)return n.replace(/(\d{3})(\d{3})(\d{2})(\d{2})/,"($1) $2-$3-$4");if(n.length===11)return n.replace(/(\d)(\d{3})(\d{3})(\d{2})(\d{2})/,"$1 $2 $3-$4-$5");return n;}

/* ---------- telegram parse ---------- */
function tgUser(v){v=String(v||"").trim();var m=v.match(/(?:t\.me\/|telegram\.me\/)?@?([A-Za-z0-9_]{3,32})/);return m?m[1]:v.replace(/[^A-Za-z0-9_]/g,"");}
function meta2(html,p){
  var m=html.match(new RegExp('<meta[^>]+property=["\']'+p+'["\'][^>]*content=["\']([^"\']*)["\']','i'));if(m)return m[1];
  m=html.match(new RegExp('<meta[^>]+content=["\']([^"\']*)["\'][^>]*property=["\']'+p+'["\']','i'));return m?m[1]:"";
}
function metaN(html,p){
  var m=html.match(new RegExp('<meta[^>]+name=["\']'+p+'["\'][^>]*content=["\']([^"\']*)["\']','i'));if(m)return m[1];

     '<a class="call" href="tel:'+esc(p.e164)+'">ПОЗВОНИТЬ</a>'+
     '<a href="https://wa.me/'+esc(p.e164.replace("+",""))+'" target="_blank">WhatsApp</a>'+
     '<a href="https://t.me/+'+esc(p.e164.replace("+",""))+'" target="_blank">Telegram</a>'+
     '<a href="viber://chat?number=%2B'+esc(p.e164.replace("+",""))+'">Viber</a>'+
     '<button data-copy="'+esc(p.e164)+'">Копировать</button></div>';
  out.appendChild(card("Номер телефона",b));
  prog.textContent="готово";
  return Promise.resolve();
}

/* ---------- domain ---------- */
function scanDom(val,out,prog){
  out=out||$("#out-dom");prog=prog||$("#prog-dom");
  var d=String(val!=null?val:$("#in-dom").value).trim().toLowerCase().replace(/^https?:\/\//,"").replace(/\/.*$/,"").replace(/^www\./,"");
  if(!out.dataset.keep)out.innerHTML="";
  if(!/^[a-z0-9.-]+\.[a-z]{2,}$/.test(d)){prog.textContent="неверный домен";return Promise.resolve();}
  prog.textContent="сканирую "+d+" ...";status("скан домена "+d);
  var jobs=[];
  jobs.push(getJson("https://rdap.org/domain/"+d,10000).then(function(j){
    var b="";
    (j.events||[]).forEach(function(e){b+='<div><span class="k">'+esc(e.eventAction)+':</span> '+esc(String(e.eventDate).slice(0,10))+'</div>';});
    if(j.entities)b+='<div><span class="k">роли контактов:</span> '+esc(j.entities.map(function(e){return (e.roles||[]).join("/");}).join(", "))+'</div>';
    if(j.nameservers)b+='<div><span class="k">NS:</span> '+esc(j.nameservers.map(function(n){return n.ldhName;}).join(", "))+'</div>';
    out.appendChild(card("RDAP (whois)",b||"нет данных"));
  }).catch(function(){out.appendChild(card("RDAP",'<span class="bad">недоступно</span>'));}));
  jobs.push(doh(d,"MX").then(function(r){out.appendChild(card("MX",esc(r.map(function(x){return x.data;}).join(", ")||"нет")));}).catch(function(){}));
  jobs.push(doh(d,"A").then(function(r){
    var ip=(r[0]&&r[0].data)||"";if(!ip)return;
    out.appendChild(card("IP-адрес сервера",esc(ip)));
    return directJson("https://ipwho.is/"+ip,8000).then(function(g){
      if(g&&g.country)out.appendChild(card("Гео IP",esc(g.country+" · "+(g.city||"")+" · "+((g.connection&&g.connection.isp)||""))));
    }).catch(function(){});
  }).catch(function(){}));
  jobs.push(getJson("https://crt.sh/?q=%25."+d+"&output=json",12000).then(function(j){
    var names={};(j||[]).forEach(function(x){String(x.name_value||"").split("\n").forEach(function(n){names[n]=1;});});
    var list=Object.keys(names).slice(0,40);
    out.appendChild(card("Поддомены (crt.sh): "+list.length,list.map(esc).join("\n")));
  }).catch(function(){}));
  return Promise.all(jobs).then(function(){prog.textContent="готово";});
}

/* ---------- aliases / past nicks ---------- */
function findAliases(q,out){
  var res=[];
  function add(site,val){if(val)res.push(site+": "+val);}
  var jobs=[
    directJson("https://api.github.com/users/"+q,9000).then(function(j){if(j&&j.login)add("GitHub",(j.name||"")+" @"+j.login);}).catch(function(){}),
    directJson("https://api.github.com/users/"+q+"/events/public",9000).then(function(j){
      var names={},mails={};
      (j||[]).slice(0,60).forEach(function(e){
        var c=e.commit;if(!c)return;
        if(c.author&&c.author.name)names[c.author.name]=1;
        if(c.author&&c.author.email)mails[c.author.email]=1;
      });
      if(Object.keys(names).length)add("GitHub: имена в коммитах",Object.keys(names).slice(0,6).join(", "));
      if(Object.keys(mails).length)add("GitHub: email в коммитах",Object.keys(mails).slice(0,6).join(", "));
    }).catch(function(){}),
    directJson("https://gitlab.com/api/v4/users?username="+q,9000).then(function(j){if(j&&j[0])add("GitLab",(j[0].name||"")+" @"+j[0].username);}).catch(function(){}),
    directJson("https://www.reddit.com/user/"+q+"/about.json",9000).then(function(j){if(j&&j.data)add("Reddit","u/"+j.data.name+(j.data.subreddit&&j.data.subreddit.title?" ("+j.data.subreddit.title+")":""));}).catch(function(){}),
    directJson("https://mastodon.social/api/v1/accounts/lookup?acct="+q,9000).then(function(j){if(j&&j.username)add("Mastodon",(j.display_name||"")+" @"+j.username);}).catch(function(){}),
    directJson("https://public.api.bsky.app/xrpc/app.bsky.actor.getProfile?actor="+q+".bsky.social",9000).then(function(j){if(j&&j.handle)add("Bluesky",(j.displayName||"")+" "+j.handle);}).catch(function(){}),
    directJson("https://api.chess.com/pub/player/"+q,9000).then(function(j){if(j&&j.username)add("Chess.com",j.name||j.username);}).catch(function(){}),
    directJson("https://keybase.io/_/api/1.0/user/lookup.json?username="+q,9000).then(function(j){var t=j&&j.them&&j.them[0];if(t)add("Keybase",((t.profile&&t.profile.full_name)||"")+" @"+q);}).catch(function(){}),
    directJson("https://gravatar.com/"+md5(q.toLowerCase())+".json",9000).then(function(j){
      var p=j&&j.entry&&j.entry[0];if(!p)return;
      if(p.displayName)add("Gravatar",p.displayName);
      (p.accounts||[]).forEach(function(a){add("Gravatar → "+(a.shortname||a.domain),a.username);});
    }).catch(function(){}),
    api("https://t.me/"+q,9000).then(function(h){var t=meta2(h,"og:title");if(t)add("Telegram",t+" (@"+q+")");}).catch(function(){})
  ];
  return Promise.all(jobs).then(function(){
    var b=res.length?res.map(function(x){return '<div>'+esc(x)+'</div>';}).join(""):'<span class="k">алиасы не найдены</span>';
    b+='<div class="k" style="margin-top:6px">прошлые ники Telegram веб-версия не отдаёт — это все найденные имена/хендлы, которыми пользователь подписывался в других сервисах.</div>';
    out.appendChild(card("Прошлые ники / алиасы",b));
  });
}

/* ---------- IP ---------- */
function visitorIP(out){
  return directJson("https://ipwho.is/",8000).then(function(g){
    if(!g||!g.ip)return;
    var b='<div><span class="k">ваш IP:</span> '+esc(g.ip)+'</div>';
    b+='<div><span class="k">гео:</span> '+esc((g.country||"")+" · "+(g.city||"")+" · "+((g.connection&&g.connection.isp)||""))+'</div>';
    var e=$("#myip");if(e)e.textContent="ваш IP: "+g.ip;
    if(out)out.appendChild(card("IP-адрес (ваш)",b));
  }).catch(function(){
    var e=$("#myip");if(e)e.textContent="ваш IP: не определён";
  });
}

/* ---------- full report ---------- */
function detect(q){
  q=q.trim();
  if(/^https?:\/\/|^t\.me\/|^@/.test(q))return "tg";
  if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(q))return "mail";
  if(/^\+?[\d\s\-\(\)]{9,}$/.test(q))return "phone";
  if(/^[a-z0-9.-]+\.[a-z]{2,}$/.test(q))return "dom";
  return "nick";
}
function fullReport(){
  var q=$("#in-rep").value.trim(),out=$("#out-rep"),prog=$("#prog-rep");
  out.innerHTML="";
  if(!q){prog.textContent="введите что искать";return;}
  var t=detect(q);
  prog.textContent="определён тип: "+({tg:"telegram",nick:"ник",mail:"email",phone:"телефон",dom:"домен"}[t])+" · собираю данные ...";
  status("полный отчёт");
  var chain;
  if(t==="tg")chain=scanTg(q,out,prog).then(function(){return scanNick(q,out,prog);});
  else if(t==="nick")chain=scanNick(q,out,prog).then(function(){return scanTg(q,out,prog);});
  else if(t==="mail")chain=scanMail(q,out,prog);
  else if(t==="phone")chain=scanPhone(q,out,prog);
  else chain=scanDom(q,out,prog);
  chain.then(function(){return findAliases(q,out);})
       .then(function(){return visitorIP(out);})
       .then(function(){
         var a=document.createElement("div");a.className="card";
         a.innerHTML='<div class="ct">Действия с отчётом</div><div class="cb"><div class="acts">'+
           '<button class="call" data-shot="1">СКРИН (PNG)</button>'+
           '<button data-share="1">Отправить / поделиться</button>'+
           '<button data-text="1">Скопировать текст</button></div></div>';
         out.insertBefore(a,out.firstChild);
         prog.textContent="отчёт готов · "+out.querySelectorAll(".card").length+" блоков";
         status("отчёт готов","good");
       });
}

/* ---------- screenshot ---------- */
function wrapTxt(ctx,text,maxW){
  var words=String(text).split(/\s+/),line="",out=[];
  words.forEach(function(w){
    var t=line?line+" "+w:w;
    if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;
  });
  if(line)out.push(line);
  return out;
}
function buildCanvas(){
  var cards=[].slice.call(document.querySelectorAll("#out-rep .card"));
  if(!cards.length)return null;
  var W=1000,pad=28;
  var lines=[];
  lines.push({t:"OSINT ОТЧЁТ",s:30,c:"#3ba3ff",b:1});
  lines.push({t:"запрос: "+$("#in-rep").value+"   ·   "+new Date().toLocaleString("ru-RU"),s:15,c:"#7d8fa3"});
  lines.push({t:"",s:8,c:"#000"});
  cards.forEach(function(c){
    var ct=c.querySelector(".ct").textContent.trim();
    var cb=c.querySelector(".cb").textContent.replace(/\n{2,}/g,"\n").trim();
    lines.push({t:"▌ "+ct.toUpperCase(),s:17,c:"#3ba3ff",b:1});
    cb.split("\n").forEach(function(l){lines.push({t:l,s:15,c:"#dbe6f2"});});
    lines.push({t:"",s:8,c:"#000"});
  });
  var meas=document.createElement("canvas").getContext("2d");
  meas.font="15px monospace";
  var wrapped=[];
  lines.forEach(function(l){
    meas.font=(l.b?"bold ":"")+l.s+"px "+(l.b?"sans-serif":"monospace");
    if(!l.t){wrapped.push(l);return;}
    wrapTxt(meas,l.t,W-pad*2).forEach(function(w,i){wrapped.push({t:w,s:l.s,c:l.c,b:l.b&&i===0});});
  });
  var H=pad;wrapped.forEach(function(l){H+=(l.s||14)+8;});H+=pad;
  var cv=document.createElement("canvas");cv.width=W;cv.height=H;
  var ctx=cv.getContext("2d");
  ctx.fillStyle="#0b0f14";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#111823";ctx.fillRect(12,12,W-24,H-24);
  var y=pad+18;
  wrapped.forEach(function(l){
    y+=(l.s||14)+8;
    ctx.font=(l.b?"bold ":"")+l.s+"px "+(l.b?"sans-serif":"monospace");
    ctx.fillStyle=l.c||"#dbe6f2";
    ctx.fillText(l.t,pad,y);
  });
  return cv;
}
function shot(){
  var cv=buildCanvas();
  if(!cv){alert("сначала построй отчёт");return;}
  try{
    var a=document.createElement("a");
    a.download="osint-report-"+Date.now()+".png";
    a.href=cv.toDataURL("image/png");
    document.body.appendChild(a);a.click();a.remove();
  }catch(e){showErr("скрин: "+e.message);}
}
function shareShot(){
  var cv=buildCanvas();
  if(!cv){alert("сначала построй отчёт");return;}
  cv.toBlob(function(blob){
    var f=new File([blob],"osint-report.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:"OSINT отчёт",text:"Отчёт по "+$("#in-rep").value}).catch(function(){});
    }else{
      shot();
    }
  },"image/png");
}
function copyText(){
  var cards=[].slice.call(document.querySelectorAll("#out-rep .card"));
  if(!cards.length){alert("сначала построй отчёт");return;}
  var t="OSINT ОТЧЁТ — "+$("#in-rep").value+"\n"+new Date().toLocaleString("ru-RU")+"\n\n";
  cards.forEach(function(c){t+="## "+c.querySelector(".ct").textContent.trim()+"\n"+c.querySelector(".cb").textContent.trim()+"\n\n";});
  try{navigator.clipboard.writeText(t);}catch(e){}
  alert("текст отчёта скопирован");
}

/* ---------- diagnostics ---------- */
function diag(){
  var out=$("#out-net"),prog=$("#prog-net");out.innerHTML="";
  var tests=[
    ["allorigins/raw",function(){return fetchT("https://api.allorigins.win/raw?url="+encodeURIComponent("https://t.me/durov"),8000);}],
    ["codetabs",function(){return fetchT("https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent("https://t.me/durov"),8000);}],
    ["corsproxy.io",function(){return fetchT("https://corsproxy.io/?"+encodeURIComponent("https://t.me/durov"),8000);}],
    ["r.jina.ai",function(){return fetchT("https://r.jina.ai/https://t.me/durov",9000);}],
    ["GitHub API (direct)",function(){return fetchT("https://api.github.com/users/torvalds",8000);}],
    ["Cloudflare DoH (direct)",function(){return fetchT("https://cloudflare-dns.com/dns-query?name=example.com&type=MX",8000,{Accept:"application/dns-json"});}]
  ];
  prog.textContent="тестирую "+tests.length+" каналов ...";var done=0;
  tests.forEach(function(t){
    var t0=Date.now();
    t[1]().then(function(){done++;out.appendChild(card(t[0],'<span class="good">OK · '+(Date.now()-t0)+' мс</span>'));prog.textContent="проверено "+done+"/"+tests.length;})
      .catch(function(e){done++;out.appendChild(card(t[0],'<span class="bad">FAIL · '+esc(e.message)+'</span>'));prog.textContent="проверено "+done+"/"+tests.length;});
  });
}

/* ---------- ui ---------- */
var curTab="rep";
function setTab(t){
  curTab=t;
  Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){b.className=(b.getAttribute("data-tab")===t?"on":"")+(b.getAttribute("data-tab")==="rep"?" hot":"");});
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(s){s.className="tab"+(s.id==="tab-"+t?" on":"");});
}
function doAct(a){
  if(a==="demo"){
    if(curTab==="rep")$("#in-rep").value="durov";
    else if(curTab==="tg")$("#in-tg").value="durov";
    else if(curTab==="nick")$("#in-nick").value="torvalds";
    else if(curTab==="mail")$("#in-mail").value="torvalds@linux-foundation.org";
    else if(curTab==="phone")$("#in-phone").value="+7 999 123-45-67";
    else if(curTab==="dom")$("#in-dom").value="github.com";
    echo("демо "+curTab);return;
  }
  if(a==="rep")fullReport();
  else if(a==="tg")scanTg();
  else if(a==="nick")scanNick();
  else if(a==="mail")scanMail();
  else if(a==="phone")scanPhone();
  else if(a==="dom")scanDom();
  else if(a==="net")diag();
}
document.addEventListener("click",function(e){
  var t=e.target;if(!t||!t.closest)return;
  var cp=t.closest("[data-copy]");
  if(cp){try{navigator.clipboard.writeText(cp.getAttribute("data-copy"));}catch(x){}cp.textContent="скопировано";setTimeout(function(){cp.textContent="Копировать";},1500);return;}
  if(t.closest("[data-shot]")){shot();return;}
  if(t.closest("[data-share]")){shareShot();return;}
  if(t.closest("[data-text]")){copyText();return;}
  var nk=t.closest("[data-nick]");
  if(nk){var n=nk.getAttribute("data-nick");setTab("nick");$("#in-nick").value=n;echo("ник из телеги "+n);scanNick();return;}
  var tb=t.closest("[data-tab]");
  if(tb){echo("таб "+tb.getAttribute("data-tab"));setTab(tb.getAttribute("data-tab"));return;}
  var ac=t.closest("[data-act]");
  if(ac){echo("кнопка "+ac.getAttribute("data-act"));doAct(ac.getAttribute("data-act"));return;}
});
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  var t=e.target;if(t&&t.getAttribute&&t.getAttribute("data-enter"))doAct(t.getAttribute("data-enter"));
});
var phTimer=null;
document.addEventListener("input",function(e){
  if(e.target&&e.target.id==="in-phone"){clearTimeout(phTimer);phTimer=setTimeout(function(){scanPhone();},400);}
});
status("ЗАПУЩЕН","good");echo("готов");
visitorIP(null);
})();
