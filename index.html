<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSINT Scanner</title>
<style>
:root{--bg:#0b0f14;--p:#111823;--p2:#16202c;--ln:#22303f;--tx:#dbe6f2;--dim:#7d8fa3;--acc:#3ba3ff;--ok:#39d98a;--err:#ff5c5c;--gold:#ffc247;--vio:#b98cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{padding:12px 14px;border-bottom:1px solid var(--ln);background:#0e141c}
h1{margin:0 0 6px;font-size:16px}
.small{font-size:12px;color:var(--dim)}
#engine{font-size:12px;font-weight:700;color:var(--dim)}
#engine.good{color:var(--ok)}
#echo{font-size:11px;color:var(--dim)}
#myip{font-size:11px;color:var(--gold)}
#err{display:none;margin:8px 14px;padding:8px 10px;background:#2a1111;border:1px solid #5c2222;color:#ffb4b4;border-radius:8px;font-size:12px;white-space:pre-wrap}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px}
nav button{background:var(--p);border:1px solid var(--ln);color:var(--dim);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
nav button.on{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:700}
nav button.hot{border-color:var(--gold);color:var(--gold)}
nav button.hot.on{background:var(--gold);color:#1a1300}
nav button.vio{border-color:var(--vio);color:var(--vio)}
nav button.vio.on{background:var(--vio);color:#150a26}
main{padding:0 14px 60px}
.tab{display:none}.tab.on{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
input{flex:1;min-width:170px;background:var(--p);border:1px solid var(--ln);color:var(--tx);padding:11px 12px;border-radius:9px;font-size:14px}
input:focus{outline:none;border-color:var(--acc)}
.go{background:var(--acc);color:#04121f;border:0;padding:11px 18px;border-radius:9px;font-weight:700;cursor:pointer}
.gold{background:var(--gold);color:#1a1300;border:0;padding:11px 18px;border-radius:9px;font-weight:800;cursor:pointer}
.vio{background:var(--vio);color:#150a26;border:0;padding:11px 18px;border-radius:9px;font-weight:800;cursor:pointer}
.ghost{background:var(--p);color:var(--tx);border:1px solid var(--ln);padding:11px 16px;border-radius:9px;cursor:pointer}
.prog{font-size:12px;color:var(--dim);margin:6px 0}
.card{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin:8px 0}
.card .ct{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--acc);font-weight:700}
.card .cb{margin-top:6px;white-space:pre-wrap;word-break:break-word;font-size:13px}
.card.big{border-color:var(--gold)}.card.big .ct{color:var(--gold)}
.card.vio{border-color:var(--vio)}.card.vio .ct{color:var(--vio)}
.k{color:var(--dim)}a{color:var(--acc)}
.bad{color:var(--err)}.good{color:var(--ok)}.warn{color:var(--gold)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts a,.acts button{font-size:12px;padding:7px 11px;border-radius:8px;border:1px solid var(--ln);background:var(--p2);color:var(--tx);cursor:pointer;text-decoration:none}
.call{background:var(--ok)!important;color:#04121f!important;font-weight:800;border:0!important;font-size:15px!important;padding:10px 20px!important}
.chip{display:inline-block;background:var(--p2);border:1px solid var(--ln);border-radius:20px;padding:3px 10px;margin:3px 4px 0 0;font-size:12px;text-decoration:none}
.av{width:72px;height:72px;border-radius:50%;float:right;margin:0 0 6px 10px;object-fit:cover;border:1px solid var(--ln)}
.grp{margin:8px 0}.grp .gt{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
</style>
</head>
<body>
<header>
  <h1>OSINT Scanner</h1>
  <div id="engine">движок: запускается...</div>
  <div id="echo">клики: 0</div>
  <div id="myip"></div>
</header>
<div id="err"></div>
<nav id="nav">
  <button data-tab="rep" class="on hot">ОТЧЁТ</button>
  <button data-tab="leak" class="vio">Утечки</button>
  <button data-tab="web">Веб-поиск</button>
  <button data-tab="tg">Telegram</button>
  <button data-tab="nick">Ник</button>
  <button data-tab="mail">Email</button>
  <button data-tab="phone">Телефон</button>
  <button data-tab="dom">Домен</button>
  <button data-tab="net">Связь</button>
</nav>
<main>
  <section class="tab on" id="tab-rep">
    <div class="row"><input id="in-rep" data-enter="rep" placeholder="tg / ник / email / телефон / ФИО / домен — что угодно"><button class="gold" data-act="rep">ИСКАТЬ ПО ВСЕМУ ИНТЕРНЕТУ</button><button class="ghost" data-act="demo">Демо</button></div>
    <div id="prog-rep" class="prog"></div><div id="out-rep"></div>
  </section>
  <section class="tab" id="tab-leak">
    <div class="row"><input id="in-leak" data-enter="leak" placeholder="email / телефон / ник / домен — что угодно"><button class="vio" data-act="leak">ПРОВЕРИТЬ УТЕЧКИ</button></div>
    <div class="row"><input id="in-pass" data-enter="leak" type="text" placeholder="пароль (необязательно) — проверить по базе слитых паролей"><button class="ghost" data-act="leak">Проверить</button><button class="ghost" data-act="demo">Демо</button></div>
    <div id="prog-leak" class="prog"></div><div id="out-leak"></div>
  </section>
  <section class="tab" id="tab-web">
    <div class="row"><input id="in-web" data-enter="web" placeholder="любая строка — номер, ФИО, ник, фраза"><button class="go" data-act="web">Искать в сети</button><button class="ghost" data-act="demo">Демо</button></div>
    <div id="prog-web" class="prog"></div><div id="out-web"></div>
  </section>
  <section class="tab" id="tab-tg">
    <div class="row"><input id="in-tg" data-enter="tg" placeholder="@username или https://t.me/username"><button class="go" data-act="tg">Анализ</button><button class="ghost" data-act="demo">Демо</button></div>
    <div id="prog-tg" class="prog"></div><div id="out-tg"></div>
  </section>
  <section class="tab" id="tab-nick">
    <div class="row"><input id="in-nick" data-enter="nick" placeholder="ник (torvalds)"><button class="go" data-act="nick">Искать</button><button class="ghost" data-act="demo">Демо</button></div>
    <div id="prog-nick" class="prog"></div><div id="out-nick"></div>
  </section>
  <section class="tab" id="tab-mail">
    <div class="row"><input id="in-mail" data-enter="mail" placeholder="email@domain.com"><button class="go" data-act="mail">Всё по почте + утечки</button><button class="ghost" data-act="demo">Демо</button></div>
    <div id="prog-mail" class="prog"></div><div id="out-mail"></div>
  </section>
  <section class="tab" id="tab-phone">
    <div class="row"><input id="in-phone" data-enter="phone" placeholder="+7 999 123-45-67"><button class="go" data-act="phone">Определить</button><button class="ghost" data-act="demo">Демо</button></div>
    <div id="prog-phone" class="prog"></div><div id="out-phone"></div>
  </section>
  <section class="tab" id="tab-dom">
    <div class="row"><input id="in-dom" data-enter="dom" placeholder="domain.com"><button class="go" data-act="dom">Сканировать</button><button class="ghost" data-act="demo">Демо</button></div>
    <div id="prog-dom" class="prog"></div><div id="out-dom"></div>
  </section>
  <section class="tab" id="tab-net">
    <div class="row"><button class="go" data-act="net">Проверить релеи и API</button></div>
    <div id="prog-net" class="prog"></div><div id="out-net"></div>
  </section>
</main>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
var echoN=0;
function echo(t){echoN++;var e=$("#echo");if(e)e.textContent="клики: "+echoN+" · "+t;}
function status(t,c){var e=$("#engine");if(!e)return;e.textContent="движок: "+t;e.className=c||"";}
function showErr(m){var e=$("#err");if(!e)return;e.style.display="block";e.textContent="ОШИБКА JS: "+m;}
window.onerror=function(m,s,l){showErr(m+(l?" (строка "+l+")":""));return false;};

/* ---------- network ---------- */
function fetchT(url,ms,headers){
  ms=ms||9000;var c=new AbortController();var t=setTimeout(function(){c.abort();},ms);
  return fetch(url,{signal:c.signal,headers:headers||{}}).then(function(r){
    clearTimeout(t);if(!r.ok)throw new Error("HTTP "+r.status);return r.text();
  },function(e){clearTimeout(t);throw e;});
}
function postJson(url,body,ms){
  ms=ms||9000;var c=new AbortController();var t=setTimeout(function(){c.abort();},ms);
  return fetch(url,{method:"POST",signal:c.signal,headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){
    clearTimeout(t);if(!r.ok)throw new Error("HTTP "+r.status);return r.json();
  },function(e){clearTimeout(t);throw e;});
}
function directJson(url,ms,h){return fetchT(url,ms,h).then(function(t){return JSON.parse(t);});}
function getJson(url,ms,h){return directJson(url,ms,h).catch(function(){return api(url,ms).then(function(t){return JSON.parse(t);});});}
var RELAYS=[
  function(u){return "https://api.allorigins.win/raw?url="+encodeURIComponent(u);},
  function(u){return "https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u);},
  function(u){return "https://corsproxy.io/?"+encodeURIComponent(u);},
  function(u){return "https://r.jina.ai/"+u;},
  function(u){return "https://api.allorigins.win/get?url="+encodeURIComponent(u);}
];
var rstate=RELAYS.map(function(){return {f:0,dead:false};});
function relayFetch(i,url,ms){
  var isGet=(i===4);
  return fetchT(RELAYS[i](url),ms).then(function(t){
    if(isGet){try{var j=JSON.parse(t);if(j&&j.contents)return j.contents;}catch(e){}}
    return t;
  });
}
function api(url,ms){
  ms=ms||9000;
  return new Promise(function(resolve,reject){
    var alive=[];for(var i=0;i<RELAYS.length;i++)if(!rstate[i].dead)alive.push(i);
    if(!alive.length){for(var k=0;k<rstate.length;k++)rstate[k].dead=false;alive=RELAYS.map(function(_,j){return j;});}
    var done=false,errs=0,timers=[];
    alive.forEach(function(idx,order){
      var to=setTimeout(function(){
        relayFetch(idx,url,ms).then(function(txt){
          if(done)return;done=true;rstate[idx].f=0;timers.forEach(clearTimeout);resolve(txt);
        },function(){
          errs++;rstate[idx].f++;if(rstate[idx].f>=3)rstate[idx].dead=true;
          if(errs>=alive.length&&!done){done=true;reject(new Error("все релеи недоступны"));}
        });
      },order*2000);
      timers.push(to);
    });
  });
}

/* ---------- md5 ---------- */
function md5(str){
  function rl(n,c){return (n<<c)|(n>>>(32-c));}
  function au(x,y){var l=(x&0xFFFF)+(y&0xFFFF),m=(x>>16)+(y>>16)+(l>>16);return (m<<16)|(l&0xFFFF);}
  function cmn(q,a,b,x,s,t){return au(rl(au(au(a,q),au(x,t)),s),b);}
  function ff(a,b,c,d,x,s,t){return cmn((b&c)|((~b)&d),a,b,x,s,t);}
  function gg(a,b,c,d,x,s,t){return cmn((b&d)|(c&(~d)),a,b,x,s,t);}
  function hh(a,b,c,d,x,s,t){return cmn(b^c^d,a,b,x,s,t);}
  function ii(a,b,c,d,x,s,t){return cmn(c^(b|(~d)),a,b,x,s,t);}
  function by(str){var n=str.length,bl=n*8,b=[];for(var i=0;i<n;i++)b.push(str.charCodeAt(i)&0xFF);b.push(0x80);while(b.length%64!==56)b.push(0);for(i=0;i<8;i++)b.push((bl>>>(8*i))&0xFF);return b;}
  function wd(str){var x=[],b=by(str);for(var i=0;i<b.length;i+=4)x.push(b[i]|(b[i+1]<<8)|(b[i+2]<<16)|(b[i+3]<<24));return x;}
  var x=wd(str),a=1732584193,b=-271733879,c=-1732584194,d=271733878;
  for(var i=0;i<x.length;i+=16){
    var oa=a,ob=b,oc=c,od=d;
    a=ff(a,b,c,d,x[i+0],7,-680876936);d=ff(d,a,b,c,x[i+1],12,-389564586);c=ff(c,d,a,b,x[i+2],17,606105819);b=ff(b,c,d,a,x[i+3],22,-1044525330);
    a=ff(a,b,c,d,x[i+4],7,-176418897);d=ff(d,a,b,c,x[i+5],12,1200080426);c=ff(c,d,a,b,x[i+6],17,-1473231341);b=ff(b,c,d,a,x[i+7],22,-45705983);
    a=ff(a,b,c,d,x[i+8],7,1770035416);d=ff(d,a,b,c,x[i+9],12,-1958414417);c=ff(c,d,a,b,x[i+10],17,-42063);b=ff(b,c,d,a,x[i+11],22,-1990404162);
    a=ff(a,b,c,d,x[i+12],7,1804603682);d=ff(d,a,b,c,x[i+13],12,-40341101);c=ff(c,d,a,b,x[i+14],17,-1502002290);b=ff(b,c,d,a,x[i+15],22,1236535329);
    a=gg(a,b,c,d,x[i+1],5,-165796510);d=gg(d,a,b,c,x[i+6],9,-1069501632);c=gg(c,d,a,b,x[i+11],14,643717713);b=gg(b,c,d,a,x[i+0],20,-373897302);
    a=gg(a,b,c,d,x[i+5],5,-701558691);d=gg(d,a,b,c,x[i+10],9,38016083);c=gg(c,d,a,b,x[i+15],14,-660478335);b=gg(b,c,d,a,x[i+4],20,-405537848);
    a=gg(a,b,c,d,x[i+9],5,568446438);d=gg(d,a,b,c,x[i+14],9,-1019803690);c=gg(c,d,a,b,x[i+3],14,-187363961);b=gg(b,c,d,a,x[i+8],20,1163531501);
    a=gg(a,b,c,d,x[i+13],5,-1444681467);d=gg(d,a,b,c,x[i+2],9,-51403784);c=gg(c,d,a,b,x[i+7],14,1735328473);b=gg(b,c,d,a,x[i+12],20,-1926607734);
    a=hh(a,b,c,d,x[i+5],4,-378558);d=hh(d,a,b,c,x[i+8],11,-2022574463);c=hh(c,d,a,b,x[i+11],16,1839030562);b=hh(b,c,d,a,x[i+14],23,-35309556);
    a=hh(a,b,c,d,x[i+1],4,-1530992060);d=hh(d,a,b,c,x[i+4],11,1272893353);c=hh(c,d,a,b,x[i+7],16,-155497632);b=hh(b,c,d,a,x[i+10],23,-1094730640);
    a=hh(a,b,c,d,x[i+13],4,681279174);d=hh(d,a,b,c,x[i+0],11,-358537222);c=hh(c,d,a,b,x[i+3],16,-722521979);b=hh(b,c,d,a,x[i+6],23,76029189);
    a=hh(a,b,c,d,x[i+9],4,-640364487);d=hh(d,a,b,c,x[i+12],11,-421815835);c=hh(c,d,a,b,x[i+15],16,530742520);b=hh(b,c,d,a,x[i+2],23,-995338651);
    a=ii(a,b,c,d,x[i+0],6,-198630844);d=ii(d,a,b,c,x[i+7],10,1126891415);c=ii(c,d,a,b,x[i+14],15,-1416354905);b=ii(b,c,d,a,x[i+5],21,-57434055);
    a=ii(a,b,c,d,x[i+12],6,1700485571);d=ii(d,a,b,c,x[i+3],10,-1894986606);c=ii(c,d,a,b,x[i+10],15,-1051523);b=ii(b,c,d,a,x[i+1],21,-2054922799);
    a=ii(a,b,c,d,x[i+8],6,1873313359);d=ii(d,a,b,c,x[i+15],10,-30611744);c=ii(c,d,a,b,x[i+6],15,-1560198380);b=ii(b,c,d,a,x[i+13],21,1309151649);
    a=ii(a,b,c,d,x[i+4],6,-145523070);d=ii(d,a,b,c,x[i+11],10,-1120210379);c=ii(c,d,a,b,x[i+2],15,718787259);b=ii(b,c,d,a,x[i+9],21,-343485551);
    a=au(a,oa);b=au(b,ob);c=au(c,oc);d=au(d,od);
  }
  function hx(n){var s="",j;for(j=0;j<4;j++)s+=("0"+((n>>(j*8))&0xFF).toString(16)).slice(-2);return s;}
  return hx(a)+hx(b)+hx(c)+hx(d);
}
/* ---------- sha1 ---------- */
function sha1(str){
  function rotl(n,c){return (n<<c)|(n>>>(32-c));}
  var bytes=[],i;
  for(i=0;i<str.length;i++){
    var ch=str.charCodeAt(i);
    if(ch<128)bytes.push(ch);
    else if(ch<2048){bytes.push(192|(ch>>6),128|(ch&63));}
    else{bytes.push(224|(ch>>12),128|((ch>>6)&63),128|(ch&63));}
  }
  var bl=bytes.length*8;
  bytes.push(0x80);
  while(bytes.length%64!==56)bytes.push(0);
  var hi=Math.floor(bl/4294967296),lo=bl>>>0;
  bytes.push((hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255);
  bytes.push((lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255);
  var h0=0x67452301,h1=0xEFCDAB89,h2=0x98BADCFE,h3=0x10325476,h4=0xC3D2E1F0,w=new Array(80);
  for(var b0=0;b0<bytes.length;b0+=64){
    for(var j=0;j<16;j++)w[j]=((bytes[b0+j*4]<<24)|(bytes[b0+j*4+1]<<16)|(bytes[b0+j*4+2]<<8)|bytes[b0+j*4+3]);
    for(j=16;j<80;j++)w[j]=rotl(w[j-3]^w[j-8]^w[j-14]^w[j-16],1);
    var a=h0,b=h1,c=h2,d=h3,e=h4;
    for(j=0;j<80;j++){
      var f,k;
      if(j<20){f=(b&c)|((~b)&d);k=0x5A827999;}
      else if(j<40){f=b^c^d;k=0x6ED9EBA1;}
      else if(j<60){f=(b&c)|(b&d)|(c&d);k=0x8F1BBCDC;}
      else{f=b^c^d;k=0xCA62C1D6;}
      var t=(rotl(a,5)+f+e+k+w[j])|0;
      e=d;d=c;c=rotl(b,30);b=a;a=t;
    }
    h0=(h0+a)|0;h1=(h1+b)|0;h2=(h2+c)|0;h3=(h3+d)|0;h4=(h4+e)|0;
  }
  function hx(n){var s="",q;for(q=0;q<4;q++)s+=("0"+((n>>>(8*(3-q)))&255).toString(16)).slice(-2);return s;}
  return (hx(h0)+hx(h1)+hx(h2)+hx(h3)+hx(h4)).toUpperCase();
}

/* ---------- helpers ---------- */
function uniq(a){var s={},o=[];a.forEach(function(x){if(!s[x]){s[x]=1;o.push(x);}});return o;}
function card(t,b,cls){var d=document.createElement("div");d.className="card"+(cls?" "+cls:"");d.innerHTML='<div class="ct">'+esc(t)+'</div><div class="cb">'+b+'</div>';return d;}
function chip(t){return '<span class="chip">'+esc(t)+'</span>';}
function ymd(d){try{return new Date(d).toISOString().slice(0,10);}catch(e){return "";}}

/* ---------- collectors ---------- */
var COL={ph:{},em:{},acc:[],loc:[],names:{},dates:[],leaks:[]};
function resetCol(){COL={ph:{},em:{},acc:[],loc:[],names:{},dates:[],leaks:[]};}
function addPh(p){if(!p)return;if(Array.isArray(p)){p.forEach(addPh);return;}var n=normPhone(p);if(String(n.nat).length>=6&&String(n.nat).length<=14)COL.ph[n.e164]=1;}
function addEm(e){if(!e)return;if(Array.isArray(e)){e.forEach(addEm);return;}if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))COL.em[e.toLowerCase()]=1;}
function addAcc(s,u,l){if(u)COL.acc.push({s:s,u:u,l:l||""});}
function addLoc(s,v){if(v&&String(v).trim())COL.loc.push(s+": "+String(v).trim());}
function addName(v){if(v&&String(v).trim())COL.names[String(v).trim()]=1;}
function addDate(s,d){if(!d)return;var x=ymd(d);if(x)COL.dates.push({s:s,d:x});}

var wmnCache=null;
function wmn(q,out){

    if(wmnCache)return Promise.resolve(wmnCache);
    try{var c=localStorage.getItem("wmn");if(c){var t=JSON.parse(c);if(t.t&&Date.now()-t.t<7*864e5){wmnCache=t.d;return Promise.resolve(t.d);}}}catch(e){}
    return getJson("https://raw.githubusercontent.com/WebBreacher/WhatsMyName/main/wmn-data.json",12000).then(function(d){wmnCache=d;try{localStorage.setItem("wmn",JSON.stringify({t:Date.now(),d:d}));}catch(e){}return d;});
  }
  return load().then(function(d){
    var sites=(d.sites||[]).filter(function(s){return s.uri_pretty&&s.known&&s.known.length;}).slice(0,60);
    var found=[];
    sites.forEach(function(s){
      var url=s.uri_pretty.replace("{account}",q);
      fetchT(url,7000).then(function(txt){
        var ok=false;
        if(s.m_string&&txt.indexOf(s.m_string)>=0)ok=true;
        if(!ok&&s.m_code&&txt.indexOf(s.m_code)>=0)ok=true;
        if(ok&&s.e_string&&txt.indexOf(s.e_string)>=0)ok=false;
        if(ok){found.push({n:s.name,u:url});addAcc("WMN: "+s.name,url,"@"+q);}
      }).catch(function(){});
    });
    return new Promise(function(res){setTimeout(function(){
      if(found.length)out.appendChild(card("WhatsMyName: найдено "+found.length,found.map(function(f){return '<a href="'+esc(f.u)+'" target="_blank" class="chip">'+esc(f.n)+'</a>';}).join(" ")));
      else out.appendChild(card("WhatsMyName",'<span class="k">совпадений нет (или часть сайтов блокирует CORS)</span>'));
      res();
    },9000);});
  }).catch(function(){});
}

      b+='<div style="font-size:17px;font-weight:800;margin:4px 0">'+esc("+"+n.cc+" "+fmtNat(n.nat))+(op?' <span class="k" style="font-size:12px;font-weight:400">'+esc(op)+'</span>':'')+'</div>';

      b+='<div class="acts"><a class="call" href="tel:'+esc(n.e164)+'">ПОЗВОНИТЬ</a><a href="https://wa.me/'+esc(n.e164.replace("+",""))+'" target="_blank">WhatsApp</a><a href="https://t.me/+'+esc(n.e164.replace("+",""))+'" target="_blank">Telegram</a><a href="viber://chat?number=%2B'+esc(n.e164.replace("+",""))+'">Viber</a><a href="skype:'+esc(n.e164)+'?call">Skype</a><button data-copy="'+esc(n.e164)+'">Копировать</button></div>';
    });
  }else b+='<div><span class="k">телефон:</span> не найден в открытых источниках</div>';
  if(ems.length)b+='<div style="margin-top:6px"><span class="k">EMAIL:</span> '+ems.map(esc).join(", ")+'</div>';
  var names=Object.keys(COL.names);
  if(names.length)b+='<div style="margin-top:6px"><span class="k">ИМЕНА:</span> '+names.slice(0,12).map(esc).join(", ")+'</div>';
  if(COL.loc.length)b+='<div style="margin-top:6px"><span class="k">АДРЕС / ЛОКАЦИЯ:</span><br>'+uniq(COL.loc).map(esc).join("<br>")+'</div>';
  return card("СВОДКА — вся найденная информация",b,"big");
}
function buildTimeline(){
  if(!COL.dates.length)return null;
  var seen={},arr=[];
  COL.dates.forEach(function(d){var k=d.s+d.d;if(seen[k])return;seen[k]=1;arr.push(d);});
  arr.sort(function(a,b){return a.d<b.d?-1:1;});
  var b=arr.map(function(d){return '<div><span class="k">'+esc(d.d)+'</span> — '+esc(d.s)+'</div>';}).join("");
  b+='<div class="k" style="margin-top:6px">самое раннее появление: '+esc(arr[0].d)+' ('+esc(arr[0].s)+')</div>';
  return card("ХРОНОЛОГИЯ — с какого года человек в сети",b,"big");
}
function buildLeaks(){
  if(!COL.leaks.length)return null;
  var seen={},arr=[];
  COL.leaks.forEach(function(l){var k=l.s+l.n;if(seen[k])return;seen[k]=1;arr.push(l);});
  arr.sort(function(a,b){return String(b.d)>String(a.d)?1:-1;});
  var b='<div>всего записей: <b>'+arr.length+'</b></div>';
  b+=arr.slice(0,30).map(function(l){return '<div>'+esc(l.n)+(l.d?' <span class="k">· '+esc(l.d)+'</span>':'')+' <span class="k">— '+esc(l.s)+'</span></div>';}).join("");
  return card("УТЕЧКИ — где засветился ("+arr.length+")",b,"vio");
}
function buildAccounts(){
  var seen={},b="",n=0;
  COL.acc.forEach(function(a){var k=a.s+a.u;if(seen[k])return;seen[k]=1;n++;b+='<a class="chip" href="'+esc(a.u)+'" target="_blank">'+esc(a.s+(a.l?" "+a.l:""))+'</a>';});
  if(!n)return null;
  return card("Все найденные аккаунты и следы ("+n+")",b);
}

/* ---------- full report ---------- */
function detect(q){
  q=q.trim();
  if(/^https?:\/\/|^t\.me\/|^@/.test(q))return "tg";
  if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(q))return "mail";
  if(/^\+?[\d\s\-\(\)]{9,}$/.test(q))return "phone";
  if(/^[a-z0-9.-]+\.[a-z]{2,}$/.test(q))return "dom";
  return "nick";
}
function fullReport(){
  var q=$("#in-rep").value.trim(),out=$("#out-rep"),prog=$("#prog-rep");
  out.innerHTML="";resetCol();
  if(!q){prog.textContent="введите что искать";return;}
  var t=detect(q);
  prog.textContent="тип: "+({tg:"telegram",nick:"ник",mail:"email",phone:"телефон",dom:"домен"}[t])+" · сканирую весь интернет ...";
  status("полный отчёт");
  var chain;
  if(t==="tg")chain=scanTg(q,out,prog).then(function(){return scanNick(q,out,prog);});
  else if(t==="nick")chain=scanNick(q,out,prog).then(function(){return scanTg(q,out,prog);});
  else if(t==="mail")chain=scanMail(q,out,prog);
  else if(t==="phone")chain=scanPhone(q,out,prog);
  else chain=scanDom(q,out,prog);
  chain.then(function(){return findAliases(q,out);})
       .then(function(){
         prog.textContent="поиск утечек по всему интернету ...";
         var lq=(t==="phone")?normPhone(q).e164:(t==="tg"?"@"+tgUser(q):q);
         return leaksSearch(lq,out,prog);
       })
       .then(function(){
         prog.textContent="веб-поиск по всему интернету ...";
         var sq=(t==="phone")?('"'+normPhone(q).e164.replace("+","")+'"'):(t==="mail"?('"'+q+'"'):q);
         return webSearch(sq,out,prog);
       })
       .then(function(){return visitorIP(out);})
       .then(function(){
         var head=document.createElement("div");
         var a=document.createElement("div");a.className="card";
         a.innerHTML='<div class="ct">Действия с отчётом</div><div class="cb"><div class="acts"><button class="call" data-shot="1">СКРИН (PNG)</button><button data-share="1">Отправить / поделиться</button><button data-text="1">Скопировать текст</button></div></div>';
         head.appendChild(a);
         head.appendChild(buildSummary(q));
         var lk=buildLeaks();if(lk)head.appendChild(lk);
         var tl=buildTimeline();if(tl)head.appendChild(tl);
         var ac=buildAccounts();if(ac)head.appendChild(ac);
         head.appendChild(deepLinks(t==="phone"?normPhone(q).e164.replace("+",""):q,t));
         out.insertBefore(head,out.firstChild);
         prog.textContent="отчёт готов · блоков: "+out.querySelectorAll(".card").length;
         status("отчёт готов","good");
       });
}

/* ---------- screenshot ---------- */
function wrapTxt(ctx,text,maxW){
  var words=String(text).split(/\s+/),line="",out=[];
  words.forEach(function(w){var t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;});
  if(line)out.push(line);return out;
}
function buildCanvas(){
  var cards=[].slice.call(document.querySelectorAll("#out-rep .card"));if(!cards.length)return null;
  var W=1000,pad=28;
  var lines=[{t:"OSINT ОТЧЁТ",s:30,c:"#ffc247",b:1},{t:"запрос: "+$("#in-rep").value+"   ·   "+new Date().toLocaleString("ru-RU"),s:15,c:"#7d8fa3"},{t:"",s:8,c:"#000"}];
  cards.forEach(function(c){
    lines.push({t:"▌ "+c.querySelector(".ct").textContent.trim().toUpperCase(),s:17,c:"#3ba3ff",b:1});
    c.querySelector(".cb").textContent.replace(/\n{2,}/g,"\n").trim().split("\n").forEach(function(l){lines.push({t:l,s:15,c:"#dbe6f2"});});
    lines.push({t:"",s:8,c:"#000"});
  });
  var meas=document.createElement("canvas").getContext("2d"),wrapped=[];
  lines.forEach(function(l){
    meas.font=(l.b?"bold ":"")+l.s+"px "+(l.b?"sans-serif":"monospace");
    if(!l.t){wrapped.push(l);return;}
    wrapTxt(meas,l.t,W-pad*2).forEach(function(w,i){wrapped.push({t:w,s:l.s,c:l.c,b:l.b&&i===0});});
  });
  var Hh=pad;wrapped.forEach(function(l){Hh+=(l.s||14)+8;});Hh+=pad;
  var cv=document.createElement("canvas");cv.width=W;cv.height=Hh;var ctx=cv.getContext("2d");
  ctx.fillStyle="#0b0f14";ctx.fillRect(0,0,W,Hh);ctx.fillStyle="#111823";ctx.fillRect(12,12,W-24,Hh-24);
  var y=pad+18;
  wrapped.forEach(function(l){y+=(l.s||14)+8;ctx.font=(l.b?"bold ":"")+l.s+"px "+(l.b?"sans-serif":"monospace");ctx.fillStyle=l.c||"#dbe6f2";ctx.fillText(l.t,pad,y);});
  return cv;
}
function shot(){var cv=buildCanvas();if(!cv){alert("сначала построй отчёт");return;}try{var a=document.createElement("a");a.download="osint-report-"+Date.now()+".png";a.href=cv.toDataURL("image/png");document.body.appendChild(a);a.click();a.remove();}catch(e){showErr("скрин: "+e.message);}}
function shareShot(){var cv=buildCanvas();if(!cv){alert("сначала построй отчёт");return;}cv.toBlob(function(blob){var f=new File([blob],"osint-report.png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:"OSINT отчёт",text:"Отчёт по "+$("#in-rep").value}).catch(function(){});else shot();},"image/png");}
function copyText(){
  var cards=[].slice.call(document.querySelectorAll("#out-rep .card"));if(!cards.length){alert("сначала построй отчёт");return;}
  var t="OSINT ОТЧЁТ — "+$("#in-rep").value+"\n"+new Date().toLocaleString("ru-RU")+"\n\n";
  cards.forEach(function(c){t+="## "+c.querySelector(".ct").textContent.trim()+"\n"+c.querySelector(".cb").textContent.trim()+"\n\n";});
  try{navigator.clipboard.writeText(t);}catch(e){}
  alert("текст отчёта скопирован");
}

    ["GitHub API (direct)",function(){return fetchT("https://api.github.com/users/torvalds",8000);}],

    ["XposedOrNot (direct)",function(){return fetchT("https://api.xposedornot.com/v1/check-email/test@example.com",9000);}],

      .catch(function(e){done++;out.appendChild(card(t[0],'<span class="bad">FAIL · '+esc(e.message)+'</span>'));prog.textContent="проверено "+done+"/"+tests.length;});

}

/* ---------- ui ---------- */
var curTab="rep";
function setTab(t){
  curTab=t;
  Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){
    var dt=b.getAttribute("data-tab");
    b.className=(dt===t?"on":"")+(dt==="rep"?" hot":"")+(dt==="leak"?" vio":"");
  });
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(s){s.className="tab"+(s.id==="tab-"+t?" on":"");});
}
function doAct(a){
  if(a==="demo"){
    if(curTab==="rep")$("#in-rep").value="torvalds";
    else if(curTab==="leak"){$("#in-leak").value="test@example.com";$("#in-pass").value="qwerty123";}
    else if(curTab==="web")$("#in-web").value="+7 999 123-45-67";
    else if(curTab==="tg")$("#in-tg").value="durov";
    else if(curTab==="nick")$("#in-nick").value="torvalds";
    else if(curTab==="mail")$("#in-mail").value="torvalds@linux-foundation.org";
    else if(curTab==="phone")$("#in-phone").value="+7 999 123-45-67";
    else if(curTab==="dom")$("#in-dom").value="github.com";
    echo("демо "+curTab);return;
  }
  if(a!=="rep")resetCol();
  if(a==="rep")fullReport();
  else if(a==="leak"){var o=$("#out-leak");o.innerHTML="";leaksSearch(null,o,$("#prog-leak"));}
  else if(a==="web"){var o2=$("#out-web");o2.innerHTML="";webSearch($("#in-web").value.trim(),o2,$("#prog-web"));}
  else if(a==="tg")scanTg();
  else if(a==="nick")scanNick();
  else if(a==="mail")scanMail();
  else if(a==="phone")scanPhone();
  else if(a==="dom")scanDom();
  else if(a==="net")diag();
}
document.addEventListener("click",function(e){
  var t=e.target;if(!t||!t.closest)return;
  var cp=t.closest("[data-copy]");
  if(cp){try{navigator.clipboard.writeText(cp.getAttribute("data-copy"));}catch(x){}cp.textContent="скопировано";setTimeout(function(){cp.textContent="Копировать";},1500);return;}
  if(t.closest("[data-shot]")){shot();return;}
  if(t.closest("[data-share]")){shareShot();return;}
  if(t.closest("[data-text]")){copyText();return;}
  var nk=t.closest("[data-nick]");
  if(nk){var n=nk.getAttribute("data-nick");setTab("nick");$("#in-nick").value=n;echo("ник из телеги "+n);resetCol();scanNick();return;}
  var tb=t.closest("[data-tab]");
  if(tb){echo("таб "+tb.getAttribute("data-tab"));setTab(tb.getAttribute("data-tab"));return;}
  var ac=t.closest("[data-act]");
  if(ac){echo("кнопка "+ac.getAttribute("data-act"));doAct(ac.getAttribute("data-act"));return;}
});
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  var t=e.target;if(t&&t.getAttribute&&t.getAttribute("data-enter"))doAct(t.getAttribute("data-enter"));
});
var phTimer=null;
document.addEventListener("input",function(e){
  if(e.target&&e.target.id==="in-phone"){clearTimeout(phTimer);phTimer=setTimeout(function(){scanPhone();},400);}
});
status("ЗАПУЩЕН","good");echo("готов");
visitorIP(null);
})();
